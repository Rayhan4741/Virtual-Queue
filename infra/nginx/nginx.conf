worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Sticky session affinity by client IP for Socket.IO HTTP long-polling + WebSocket upgrade
    upstream vq_backend {
        ip_hash;
        server backend-1:5000 max_fails=3 fail_timeout=15s;
        server backend-2:5000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Uncomment for TLS termination in production:
        # listen 443 ssl http2;
        # ssl_certificate /etc/letsencrypt/live/api.virtualqueue.app/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/api.virtualqueue.app/privkey.pem;

        location /api/ {
            proxy_pass http://vq_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /socket.io/ {
            proxy_pass http://vq_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /lb-health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }
    }
}
