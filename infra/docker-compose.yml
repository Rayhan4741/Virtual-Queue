version: '3.9'

services:
  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped

  backend-1:
    build:
      context: ../backend
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: backend-1
      MONGODB_URI: mongodb://mongodb:27017/virtual-queue
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173,http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-access-secret-replace-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-refresh-secret-replace-me-32chars}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-prod-qr-secret-replace-me-32chars}
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend-2:
    build:
      context: ../backend
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: backend-2
      MONGODB_URI: mongodb://mongodb:27017/virtual-queue
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173,http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-access-secret-replace-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-refresh-secret-replace-me-32chars}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-prod-qr-secret-replace-me-32chars}
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
